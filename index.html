<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まなびの森 ｜ 小中学生のための遊んでわかる教材</title>
<meta name="description" content="さわって、うごかして、わかる。小学生・中学生のための無料の学習教材。">
<meta property="og:title" content="まなびの森">
<meta property="og:description" content="さわって、うごかして、わかる。小中学生のための無料の学習教材。">
<meta property="og:type" content="website">
<meta property="og:image" content="ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg:#fdf8ee; --ink:#2f3a2f; --leaf:#4f9a5a; --card:#fff; --sub:#7a8577; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
  header { text-align:center; padding:40px 16px 24px; }
  h1 { margin:0; font-size:2rem; color:var(--leaf); letter-spacing:.05em; }
  header p { margin:8px 0 0; color:var(--sub); }
  .filters { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 16px 16px; }
  .filters button { border:2px solid var(--leaf); background:#fff; color:var(--leaf); border-radius:999px; padding:6px 14px; font:inherit; font-weight:bold; cursor:pointer; }
  .filters button.on { background:var(--leaf); color:#fff; }
  main { max-width:960px; margin:0 auto; padding:0 16px 48px; }
  .grade { scroll-margin-top:12px; margin-top:28px; }
  .grade h2.gh { font-size:1.4rem; margin:0 0 12px; padding-left:12px; border-left:8px solid var(--leaf); }
  .grade.jr h2.gh { border-color:#3f7fbf; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .empty { color:var(--sub); background:#fff; border:2px dashed #e6dcc6; border-radius:16px; padding:16px; text-align:center; }
  .filters a { border:2px solid var(--leaf); background:#fff; color:var(--leaf); border-radius:999px; padding:6px 14px; font-weight:bold; text-decoration:none; }
  .filters a.jr { border-color:#3f7fbf; color:#3f7fbf; }
  a.card { display:block; background:var(--card); border-radius:16px; padding:20px; text-decoration:none; color:inherit; box-shadow:0 3px 0 #e6dcc6; transition:transform .15s; }
  a.card:hover { transform:translateY(-3px); }
  .emoji { font-size:2.4rem; }
  .tags { display:flex; gap:6px; margin:8px 0; }
  .tag { font-size:.75rem; padding:2px 8px; border-radius:999px; background:#e8f3e9; color:var(--leaf); font-weight:bold; }
  .tag.subj { background:#fff1d6; color:#b07a12; }
  .card h2 { margin:4px 0; font-size:1.2rem; }
  .card p { margin:0; color:var(--sub); font-size:.9rem; line-height:1.6; }
  footer { text-align:center; color:var(--sub); font-size:.8rem; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>🌳 まなびの森</h1>
  <p>さわって、うごかして、わかる。</p>
</header>
<div class="filters" id="filters"></div>
<main id="list"></main>
<footer>© まなびの森</footer>
<script>
// 教材を追加するときは、この配列に1行足すだけ
const items = [
  { path:"warizan/", emoji:"🍬", title:"わり算ってなに？", grade:"小3", subject:"算数",
    desc:"あめをお皿に分けて、わり算のしくみを目で見てたしかめよう。さいごにクイズも！" },
];
const grades = ["小1","小2","小3","小4","小5","小6","中1","中2","中3"];
document.getElementById("filters").innerHTML = grades.map((g, i) =>
  `<a href="#g${i}" class="${g.startsWith('中')?'jr':''}">${g}</a>`).join("");
document.getElementById("list").innerHTML = grades.map((g, i) => {
  const list = items.filter(it => it.grade === g);
  const body = list.length
    ? `<div class="grid">${list.map(it => `<a class="card" href="${it.path}">
        <div class="emoji">${it.emoji}</div>
        <div class="tags"><span class="tag subj">${it.subject}</span></div>
        <h2>${it.title}</h2><p>${it.desc}</p></a>`).join("")}</div>`
    : `<p class="empty">じゅんび中だよ。お楽しみに！</p>`;
  return `<section class="grade ${g.startsWith('中')?'jr':''}" id="g${i}"><h2 class="gh">${g.replace('小','小学').replace('中','中学')}年生</h2>${body}</section>`;
}).join("");
</script>
</body>
</html>
