<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わり算ってなに？（小3算数）｜まなびの森</title>
<meta name="description" content="あめをお皿に分けて、わり算のしくみを目で見てたしかめよう。">
<meta property="og:title" content="わり算ってなに？（小3算数）">
<meta property="og:description" content="あめをお皿に分けて、わり算のしくみを目で見てたしかめよう。">
<meta property="og:type" content="article">
<meta property="og:image" content="ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg:#fdf8ee; --ink:#2f3a2f; --leaf:#4f9a5a; --sub:#7a8577; --accent:#e9724c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .back { color:var(--leaf); text-decoration:none; font-weight:bold; }
  h1 { color:var(--leaf); margin:16px 0 4px; }
  .lead { color:var(--sub); margin:0 0 20px; line-height:1.7; }
  section { background:#fff; border-radius:16px; padding:20px; margin-bottom:20px; box-shadow:0 3px 0 #e6dcc6; }
  h2 { margin:0 0 12px; font-size:1.2rem; }
  .row { display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap; }
  .row label { min-width:90px; font-weight:bold; }
  .stepper { display:flex; align-items:center; gap:8px; }
  .stepper button { width:40px; height:40px; border-radius:50%; border:none; background:#e8f3e9; color:var(--leaf); font-size:1.4rem; font-weight:bold; cursor:pointer; }
  .stepper span { min-width:2.5em; text-align:center; font-size:1.4rem; font-weight:bold; }
  .btn { border:none; background:var(--accent); color:#fff; font:inherit; font-weight:bold; font-size:1.1rem; padding:10px 22px; border-radius:999px; cursor:pointer; box-shadow:0 3px 0 #b9532f; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.sub { background:#fff; color:var(--accent); border:2px solid var(--accent); box-shadow:none; }
  .pile { min-height:44px; font-size:1.6rem; letter-spacing:2px; margin:12px 0; }
  .plates { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .plate { width:120px; min-height:90px; border-radius:50%/40%; background:#f3efe6; border:3px solid #e0d6c0; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; padding:10px; font-size:1.3rem; }
  .eq { text-align:center; font-size:1.6rem; font-weight:bold; margin-top:16px; min-height:2em; }
  .eq .ans { color:var(--accent); }
  .note { color:var(--sub); font-size:.95rem; line-height:1.7; }
  .q { font-size:1.6rem; font-weight:bold; text-align:center; margin:12px 0; }
  .choices { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .choices button { font:inherit; font-size:1.3rem; font-weight:bold; padding:14px; border-radius:12px; border:2px solid #e0d6c0; background:#fff; cursor:pointer; }
  .choices button.ok { background:#dff2e1; border-color:var(--leaf); }
  .choices button.ng { background:#fde4dc; border-color:var(--accent); }
  .fb { text-align:center; min-height:1.6em; font-weight:bold; margin:10px 0; }
  .progress { text-align:center; color:var(--sub); }
  .result { text-align:center; font-size:1.4rem; }
  @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
  .candy { display:inline-block; animation:pop .25s ease-out; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← まなびの森へもどる</a>
  <h1>🍬 わり算ってなに？</h1>
  <p class="lead">わり算は「<b>同じ数ずつ分ける</b>」ための計算だよ。<br>あめをお皿にくばって、1さらに何こになるか見てみよう。</p>

  <section>
    <h2>① あめを分けてみよう</h2>
    <div class="row"><label>あめの数</label>
      <div class="stepper"><button onclick="chg('total',-1)">−</button><span id="total">12</span><button onclick="chg('total',1)">＋</button></div></div>
    <div class="row"><label>お皿の数</label>
      <div class="stepper"><button onclick="chg('plates',-1)">−</button><span id="platesN">3</span><button onclick="chg('plates',1)">＋</button></div></div>
    <div class="row"><button class="btn" id="go" onclick="deal()">くばる！</button></div>
    <div class="pile" id="pile"></div>
    <div class="plates" id="plates"></div>
    <div class="eq" id="eq"></div>
    <p class="note" id="explain"></p>
  </section>

  <section>
    <h2>② ポイント</h2>
    <p class="note">
      ・<b>12 ÷ 3 = 4</b> は「12こを3つに同じ数ずつ分けると、1つ分は4こ」という意味。<br>
      ・たしかめは<b>かけ算</b>でできるよ。4 × 3 = 12 だね。<br>
      ・ぴったり分けられないときは、のこりを「<b>あまり</b>」というよ。（例：13 ÷ 3 = 4 あまり 1）
    </p>
  </section>

  <section>
    <h2>③ クイズにちょうせん！</h2>
    <div id="quiz"></div>
  </section>
</div>

<script>
const state = { total:12, plates:3 };
let dealing = false;
function chg(key, d) {
  if (dealing) return;
  const lim = key === 'total' ? [1, 30] : [1, 6];
  state[key] = Math.min(lim[1], Math.max(lim[0], state[key] + d));
  document.getElementById('total').textContent = state.total;
  document.getElementById('platesN').textContent = state.plates;
  reset();
}
function reset() {
  document.getElementById('pile').textContent = '🍬'.repeat(state.total);
  document.getElementById('plates').innerHTML =
    Array.from({length:state.plates}, (_, i) => `<div class="plate" id="p${i}"></div>`).join('');
  document.getElementById('eq').innerHTML = '';
  document.getElementById('explain').textContent = '';
}
function deal() {
  if (dealing) return;
  reset();
  dealing = true;
  document.getElementById('go').disabled = true;
  const per = Math.floor(state.total / state.plates);
  const rest = state.total % state.plates;
  let given = 0;
  const steps = per * state.plates;
  const speed = Math.max(80, Math.min(350, 3000 / Math.max(steps, 1)));
  const timer = setInterval(() => {
    if (given >= steps) {
      clearInterval(timer);
      dealing = false;
      document.getElementById('go').disabled = false;
      const restTxt = rest ? ` あまり <span class="ans">${rest}</span>` : '';
      document.getElementById('eq').innerHTML =
        `${state.total} ÷ ${state.plates} = <span class="ans">${per}</span>${restTxt}`;
      document.getElementById('explain').innerHTML = rest
        ? `1さらに${per}こずつ。${rest}こは、もう全部のお皿に同じ数ずつはくばれないので「あまり」になったよ。たしかめ：${per} × ${state.plates} + ${rest} = ${state.total}`
        : `1さらに${per}こずつ、ぴったり分けられたね！ たしかめ：${per} × ${state.plates} = ${state.total}`;
      return;
    }
    const plate = document.getElementById('p' + (given % state.plates));
    plate.insertAdjacentHTML('beforeend', '<span class="candy">🍬</span>');
    given++;
    document.getElementById('pile').textContent = '🍬'.repeat(state.total - given);
  }, speed);
}
reset();

// クイズ
const QN = 5;
let qi = 0, score = 0, cur = null;
function makeQ() {
  const withRest = qi >= 3; // 後半はあまりのある問題
  const b = 2 + Math.floor(Math.random() * 8);
  const a = 1 + Math.floor(Math.random() * 9);
  const r = withRest ? 1 + Math.floor(Math.random() * (b - 1)) : 0;
  const total = a * b + r;
  const fmt = (q, rr) => rr ? `${q} あまり ${rr}` : `${q}`;
  const right = fmt(a, r);
  const set = new Set([right]);
  while (set.size < 4) {
    const dq = Math.max(1, a + Math.floor(Math.random() * 7) - 3);
    const dr = withRest ? Math.floor(Math.random() * b) : 0;
    set.add(fmt(dq, dr));
  }
  return { text:`${total} ÷ ${b} = ？`, right, opts:[...set].sort(() => Math.random() - .5),
           hint:`たしかめ：${a} × ${b}${r ? ' + ' + r : ''} = ${total}` };
}
function showQ() {
  const box = document.getElementById('quiz');
  if (qi >= QN) {
    const msg = score === QN ? '全問正解！すごい！🎉' : score >= 3 ? 'よくできました！👏' : 'もう一回ちょうせんしてみよう！💪';
    box.innerHTML = `<p class="result">${QN}問中 <b>${score}</b>問 正解<br>${msg}</p>
      <div class="row" style="justify-content:center"><button class="btn" onclick="qi=0;score=0;showQ()">もう一回</button></div>`;
    return;
  }
  cur = makeQ();
  box.innerHTML = `<p class="progress">${qi + 1} / ${QN} もんめ${qi >= 3 ? '（あまりあり）' : ''}</p>
    <p class="q">${cur.text}</p>
    <div class="choices">${cur.opts.map(o => `<button onclick="answer(this)">${o}</button>`).join('')}</div>
    <p class="fb" id="fb"></p>`;
}
function answer(btn) {
  const btns = document.querySelectorAll('.choices button');
  btns.forEach(b => { b.disabled = true; if (b.textContent === cur.right) b.classList.add('ok'); });
  const ok = btn.textContent === cur.right;
  if (ok) score++; else btn.classList.add('ng');
  document.getElementById('fb').innerHTML = (ok ? '⭕ せいかい！ ' : '❌ ざんねん… ') + cur.hint;
  setTimeout(() => { qi++; showQ(); }, 1600);
}
showQ();
</script>
</body>
</html>
